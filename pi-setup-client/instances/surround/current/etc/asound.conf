# Location of this file: `/etc/asound.conf`
#
# Ziel:  Jedes Stereo-Signal, das eine App über das ALSA-Default-Device
#        ausgibt, wird auf 6 Kanäle (5.1: FL, FR, FC, LFE, RL, RR) hochgemischt
#        und an eine USB-Soundkarte (CM6206-basiert) ausgegeben.
#
# Geschichte:
#   - kudos (v0):       https://lichtmetzger.de/en/2014/04/22/better-stereo-to-5-1-upmix-on-linux-alsa-asoundrc/
#   - kudos (v1):       ChatGPT-gestützte Variante mit zusätzlichem Capture-Pfad
#   - aktuell (v2):     Aufgeräumt - kein Capture-Pfad, Karte by-name, eine
#                       Plug-Stufe statt zwei, expliziter ctl.!default.
#
# Signalfluss:
#
#     +--------------------+
#     |     !default       |  Einstiegspunkt für jede App
#     |     (type plug)    |  - adaptiert Rate (z. B. 48 kHz -> 44,1 kHz)
#     |                    |  - adaptiert Format (z. B. S32_LE -> S16_LE)
#     +---------+----------+
#               |
#               v
#     +--------------------+
#     |       upmix        |  Stereo (2ch) -> Surround (6ch)
#     |    (type route)    |  Mapping per ttable (siehe unten)
#     +---------+----------+
#               |
#               v
#     +--------------------+
#     |      dmixer        |  Software-Mischer
#     |    (type dmix)     |  - mehrere Apps gleichzeitig
#     |                    |  - oeffnet die Karte EINMAL mit 6 Kanaelen
#     +---------+----------+
#               |
#               v
#     +--------------------+
#     |       CM106        |  Physikalisches Geraet (USB-Karte)
#     |     (type hw)      |  Adressiert per Karten-Name (nicht Index!)
#     +--------------------+
#
# WICHTIG fuer Apps, die `default` umgehen (z. B. snapclient):
#   In der App das Geraet explizit auf `plug:upmix` setzen. snapclient:
#     /etc/default/snapclient -> SNAPCLIENT_OPTS="-s plug:upmix"
#   Siehe ../../snapclient/README.md
#
# Verifikation, dass der Upmix wirklich greift (waehrend Audio laeuft):
#   cat /proc/asound/card<N>/pcm0p/sub0/hw_params
#   Erwartung: channels: 6  (NICHT 2)
#

# -----------------------------------------------------------------------------
# Default-Geraet: Jede App, die nichts anderes spezifiziert, landet hier.
#
# `type plug` ist der "Adapter": akzeptiert beliebige Rate/Format/Channel-
# Kombinationen vom Aufrufer und konvertiert sie auf das, was der Slave (hier:
# `upmix`) erwartet. Konkret:
#   - Rate-Konvertierung 48 kHz -> 44,1 kHz (bzw. was die Karte nativ kann)
#   - Channel-Anpassung (1ch Mono / 5.1 / etc. -> 2ch, denn `upmix` will Stereo)
# -----------------------------------------------------------------------------
pcm.!default {
    type plug
    slave.pcm "upmix"
}

# -----------------------------------------------------------------------------
# Default-Controller: damit `alsamixer`, `amixer`, GUI-Volume-Slider etc. die
# richtige Karte treffen, wenn sie das Default-Control abfragen.
# -----------------------------------------------------------------------------
ctl.!default {
    type hw
    card "ICUSBAUDIO7D"
}

# -----------------------------------------------------------------------------
# Upmix Stereo -> 5.1 via `type route`.
#
# `route` ist ein reines Matrix-Mapping (keine Filter, kein Delay, keine
# Dekorrelation). Die `ttable` beschreibt: "vom Eingangskanal X mit Verstaerkung
# G auf Ausgangskanal Y".
#
# Eingangskanaele:  0 = links, 1 = rechts (Stereo-Quelle)
# Ausgangskanaele (Standard-5.1-Reihenfolge bei CM6206):
#   0 = Front  Links
#   1 = Front  Rechts
#   2 = Center
#   3 = LFE (Subwoofer)
#   4 = Rear/Surround Links
#   5 = Rear/Surround Rechts
#
# Gain-Werte:
#   1.0   -> 0 dB     (unveraendert)
#   0.707 -> -3 dB    ("equal energy", Standard fuer Center-Downmix)
#   0.5   -> -6 dB    ("equal amplitude", konservativer)
#
# Bewusste Designentscheidungen hier:
#   - Front -> Front: 0 dB (unveraendert, Original-Stereo bleibt vorne).
#   - Front -> Rear:  0 dB (vollstaendige Verdopplung nach hinten; mehr
#                     "Raum"-Effekt, kein echter Surround-Mix).
#   - Front -> Center: -6 dB (L+R kombiniert in Mono-Center; -6 dB statt -3 dB
#                     verhindert Clipping bei korrelierten Signalen).
#   - Front -> LFE:   -6 dB *ohne Lowpass*. ACHTUNG: ein "echter" Sub bekommt
#                     normalerweise nur < ~120 Hz. `route` kann nicht filtern.
#                     Wer das sauberer will: LADSPA mit `lowpass_iir`
#                     dazwischenschalten (eigene PCM-Definition).
# -----------------------------------------------------------------------------
pcm.upmix {
    type route
    slave.pcm dmixer
    slave.channels 6
    #####  EINGANGSKANAL.AUSGANGSKANAL  GAIN
    ttable.0.0 1       # FL  -> FL
    ttable.1.1 1       # FR  -> FR
    ttable.0.4 1       # FL  -> RL
    ttable.1.5 1       # FR  -> RR
    ttable.0.2 0.5     # FL  -> Center  (-6 dB)
    ttable.1.2 0.5     # FR  -> Center  (-6 dB)
    ttable.0.3 0.5     # FL  -> LFE     (-6 dB, ungefiltert!)
    ttable.1.3 0.5     # FR  -> LFE     (-6 dB, ungefiltert!)
}

# -----------------------------------------------------------------------------
# Software-Mischer: erlaubt mehreren Apps die gleichzeitige Ausgabe auf eine
# einzige Soundkarte (die selbst nur einen Stream gleichzeitig kann).
#
# Wichtig: `dmix` oeffnet die Hardware EINMAL mit den hier konfigurierten
# Parametern (6 Kanaele) und teilt sie via Shared Memory zwischen Prozessen.
# Daraus folgt direkt:
#   - Wer in dmix reinschreibt, MUSS 6 Kanaele liefern -> deshalb hat `upmix`
#     `slave.channels 6` und produziert 6 Kanaele.
#   - Der erste Prozess legt die Parameter fest; spaetere Clients muessen
#     dazu passen (sonst Konversion via `plug` davor).
#   - `ipc_perm 0666` ist wichtig, damit verschiedene Linux-User (z. B. der
#     `snapclient`-User und `clemens`) denselben Mixer teilen koennen.
#
# Buffer/Period (latenz- vs. stabilitaets-Tradeoff):
#   period_size 1024, buffer_size 4096 -> 4 Perioden Puffer.
#   Bei 44,1 kHz / 16 bit / 6ch entspricht eine Periode ~23 ms,
#   Gesamtpuffer ~93 ms. Konservativ, stabil auf Raspberry Pi.
# -----------------------------------------------------------------------------
pcm.dmixer {
    type dmix
    # IPC-Key: muss unter Mit-Nutzern des Mixers identisch sein.
    # Beliebige Zahl, sollte aber nicht mit anderen ALSA-Configs kollidieren.
    ipc_key 1024
    # 0666 = rw fuer alle User (sonst kann der snapclient-User nicht teilen)
    ipc_perm 0666
    slave.pcm "CM106"
    slave {
        period_time 0      # 0 = Periodenzeit aus period_size ableiten
        period_size 1024   # Frames pro Periode
        buffer_size 4096   # Gesamt-Buffer (= 4 * period_size)
        channels 6         # 5.1 Surround
    }
    # 1:1-Mapping Eingangskanaele -> Karten-Kanaele
    bindings {
        0 0   # FL
        1 1   # FR
        2 2   # FC
        3 3   # LFE
        4 4   # RL
        5 5   # RR
    }
}

# -----------------------------------------------------------------------------
# Physikalische Soundkarte.
#
# Karte wird per NAME adressiert (`card "ICUSBAUDIO7D"`), nicht per Index.
# Vorteil: ueberlebt das Einstecken zusaetzlicher Audio-Devices (HDMI-Audio,
# zweite USB-Karte etc.), die sonst die Indizes verschieben wuerden.
#
# Namen ermitteln:
#   aplay -l
#   -> "card 0: ICUSBAUDIO7D [ICUSBAUDIO7D], device 0: USB Audio ..."
#   -> Name in den eckigen Klammern = der Karten-Name fuer `card "..."`.
#
# Wenn die Karte einen anderen Namen hat, hier UND in `ctl.!default` anpassen.
# -----------------------------------------------------------------------------
pcm.CM106 {
    type hw
    card "ICUSBAUDIO7D"
    device 0
}

ctl.CM106 {
    type hw
    card "ICUSBAUDIO7D"
}
